{% extends "base.html" %}
{% block title %}Ingreso administrativo · Liga Rocket League{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-box">
    <div class="ball"></div>
    <h1>🔐 Acceso admin</h1>
    <p class="hint">Ingresa la clave para gestionar la liga.</p>
    <form method="POST">
      <input type="password" name="clave" placeholder="Clave de administrador" autofocus>
      <button class="btn" style="width:100%;" type="submit">Entrar</button>
    </form>
    <p style="margin-top:14px;"><a href="{{ url_for('index') }}">← Volver a la página</a></p>
  </div>
</div>
{% endblock %}
